name: Nexcord Client Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - nexcord-development

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Install dependencies
        run: deno install --frozen
      - name: Build production bundle
        run: deno run build
      - name: Upload Nexcord test bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexcord-client-test-bundle
          path: dist/revenge.bundle
          if-no-files-found: error
